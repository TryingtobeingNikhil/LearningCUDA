<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Patrick+Hand&display=block" rel="stylesheet">
  <style>body { margin: 0; background: #fdfaf3; } svg { display: block; }</style>
</head>
<body>
<svg id="canvas" width="1600" height="900" viewBox="0 0 1600 900"></svg>
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
<script src="sketch.js"></script>
<script>
fontsReady.then(() => {
  title("bitonic sort", "day 14 · sorting networks: 55 parallel steps for 1024 elements");

  // =======================================================================
  // LEFT COLUMN: How Bitonic Sort Works (8 Elements)
  // =======================================================================
  const leftX = 80, colW = 740, topY = 190, boxH = 485;
  box(leftX, topY, colW, boxH, { fill: COLORS.teal, strokeWidth: 2 });

  text(leftX + colW / 2, topY + 38, "Building & Merging Bitonic Sequences", { size: 28, weight: 700, anchor: "middle" });
  text(leftX + colW / 2, topY + 68, "8-element example · stages 2 → 4 → 8 · 6 total steps", { size: 20, color: COLORS.muted, anchor: "middle" });

  const elemW = 66, elemH = 42, elemGap = 12;
  const startX = leftX + 85;
  const rowYs = [topY + 115, topY + 190, topY + 265, topY + 340];

  const rowLabels = ["input", "stage 2 (d=1)", "stage 4 (d=2,1)", "stage 8 (d=4,2,1)"];
  for (let r = 0; r < 4; r++) {
    text(startX - 15, rowYs[r] + 28, rowLabels[r], { size: 19, color: COLORS.muted, anchor: "end" });
  }

  // Row 0: Input [3, 7, 4, 8, 6, 2, 1, 5]
  const inVals = [3, 7, 4, 8, 6, 2, 1, 5];
  for (let i = 0; i < 8; i++) {
    box(startX + i * (elemW + elemGap), rowYs[0], elemW, elemH,
        { fill: COLORS.purple, label: String(inVals[i]), size: 22 });
  }

  // Row 1: Stage 2 (alternating pairs: asc, desc, asc, desc) -> [3, 7, 8, 4, 2, 6, 5, 1]
  const s2Vals = [3, 7, 8, 4, 2, 6, 5, 1];
  for (let i = 0; i < 8; i++) {
    const isDesc = (i === 2 || i === 3 || i === 6 || i === 7);
    box(startX + i * (elemW + elemGap), rowYs[1], elemW, elemH,
        { fill: isDesc ? COLORS.coral : COLORS.teal, label: String(s2Vals[i]), size: 22 });
  }

  // Row 2: Stage 4 (groups of 4: asc [3, 4, 7, 8], desc [6, 5, 2, 1]) -> bitonic sequence!
  const s4Vals = [3, 4, 7, 8, 6, 5, 2, 1];
  for (let i = 0; i < 8; i++) {
    box(startX + i * (elemW + elemGap), rowYs[2], elemW, elemH,
        { fill: i >= 4 ? COLORS.coral : COLORS.teal, label: String(s4Vals[i]), size: 22 });
  }

  // Row 3: Stage 8 (all ascending) -> fully sorted [1, 2, 3, 4, 5, 6, 7, 8]!
  const s8Vals = [1, 2, 3, 4, 5, 6, 7, 8];
  for (let i = 0; i < 8; i++) {
    box(startX + i * (elemW + elemGap), rowYs[3], elemW, elemH,
        { fill: COLORS.coral, label: String(s8Vals[i]), size: 22 });
  }

  // Explanatory bullets
  text(leftX + 30, topY + 415, "• Stage 2: sort 2-element pairs into alternating up / down slopes", { size: 20 });
  text(leftX + 30, topY + 442, "• Stage 4: merge pairs into 4-element bitonic sequences (rises, then falls)", { size: 20 });
  text(leftX + 30, topY + 468, "• Stage 8: bitonic split merges entire array into final sorted order!", { size: 20, color: COLORS.teal, weight: 700 });


  // =======================================================================
  // RIGHT COLUMN: Why Sorting Networks Rule on GPUs
  // =======================================================================
  const rightX = 850;
  box(rightX, topY, colW - 30, boxH, { fill: COLORS.purple, strokeWidth: 2 });

  text(rightX + (colW - 30) / 2, topY + 38, "Sorting Networks vs CPU Sorts", { size: 28, weight: 700, anchor: "middle" });
  text(rightX + (colW - 30) / 2, topY + 68, "Predetermined comparison wires · 100% data-independent", { size: 20, color: COLORS.muted, anchor: "middle" });

  // CPU Sorts Box
  const subW = colW - 90;
  box(rightX + 30, topY + 110, subW, 140, { fill: COLORS.yellow, strokeWidth: 2 });
  text(rightX + 45, topY + 140, "Why QuickSort / MergeSort Struggle on GPU:", { size: 22, weight: 700, color: COLORS.coral });
  text(rightX + 45, topY + 172, "• Dynamic branches: threads in a warp take different execution paths", { size: 20 });
  text(rightX + 45, topY + 200, "• Irregular memory accesses: non-coalesced partition scatter", { size: 20 });
  text(rightX + 45, topY + 228, "• Recursion & stack overhead: high register pressure stalls SMs", { size: 20, color: COLORS.muted });

  // Sorting Network Box
  box(rightX + 30, topY + 270, subW, 195, { fill: COLORS.teal, strokeWidth: 2 });
  text(rightX + 45, topY + 302, "Why Bitonic Network Wins in Shared Memory:", { size: 22, weight: 700, color: COLORS.teal });
  text(rightX + 45, topY + 334, "• Zero warp divergence: every thread runs the exact same comparison", { size: 20 });
  text(rightX + 45, topY + 362, "• 1024 elements: only 55 parallel steps (vs 1024 for Odd-Even)", { size: 20, color: COLORS.teal, weight: 700 });
  text(rightX + 45, topY + 390, "• 28,160 comparisons total (vs 524,288 for linear networks — 18.6× less!)", { size: 20 });
  text(rightX + 45, topY + 418, "• 100% on-chip: all 55 steps execute inside fast shared memory", { size: 20 });
  text(rightX + 45, topY + 446, "• Step formula: int j = i + d; swap if (val_i > val_j) == asc", { size: 19, color: COLORS.muted });


  // =======================================================================
  // BOTTOM BOX: The Takeaway
  // =======================================================================
  const botY = 700, botH = 150;
  box(leftX, botY, 1480, botH, { fill: COLORS.yellow, strokeWidth: 2 });

  text(leftX + 30, botY + 38, "the GPU paradigm: logarithmic network depth O(log^2 N)", { size: 26, weight: 700, color: COLORS.coral });
  text(leftX + 30, botY + 74, "• On GPUs, sorting performance is dictated by network depth (number of barriers and parallel steps).", { size: 21 });
  text(leftX + 30, botY + 104, "• Bitonic sort reduces network depth from O(N) down to O(log^2 N) — taking just 55 steps for 1024 elements.", { size: 21 });

  const takeEl = text(leftX + 30, botY + 134, "takeaway: fixed, data-independent comparisons eliminate warp divergence and let thousands of threads sort in lock-step",
                      { size: 22, color: COLORS.coral, weight: 700 });
  underline(takeEl, COLORS.coral);
});
</script>
</body>
</html>
