<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Patrick+Hand&display=block" rel="stylesheet">
<style>body { margin: 0; background: #fdfaf3; } svg { display: block; }</style>
</head>
<body>
<svg id="canvas" width="1600" height="900" viewBox="0 0 1600 900"></svg>
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
<script src="sketch.js"></script>
<script>
fontsReady.then(() => {
  title("which ifs cost you", "day 07 · real numbers from a T4");

  const cards = [
    { x: 90, fill: COLORS.teal, head: "boundary check", code: ["if (i < n)", "  c[i] = a[i] + b[i];"],
      note: ["only the very last warp is", "split → basically free"] },
    { x: 580, fill: COLORS.purple, head: "tiny branch (ReLU)", code: ["if (x > 0) y = x; else y = 0;", "y = fmaxf(x, 0.0f);"],
      note: ["if: 0.197 ms, fmaxf: 0.140 ms", "→ I guessed a tie. fmaxf 1.4× faster"] },
    { x: 1070, fill: COLORS.coral, head: "big branch, split per thread", code: ["if (tid % 2) heavyA();", "else        heavyB();"],
      note: ["every warp pays A + B:", "6.68 ms vs A + B = 6.73 ms"] },
  ];
  for (const c of cards) {
    box(c.x, 250, 440, 380, { fill: c.fill });
    text(c.x + 25, 300, c.head, { font: "'Caveat', cursive", size: 42, weight: 700 });
    box(c.x + 25, 330, 390, 120, { fill: "#fdfaf3", fillStyle: "solid" });
    text(c.x + 45, 380, c.code[0], { size: 26 });
    text(c.x + 45, 420, c.code[1], { size: 26 });
    text(c.x + 25, 520, c.note[0], { size: 26 });
    text(c.x + 25, 560, c.note[1], { size: 26 });
  }

  text(90, 715, "fix: split by warp (threadIdx.x / 32) so whole warps agree  →  6.68 → 5.25 ms (1.27×)", { size: 28 });
  text(90, 758, "theory said 2×, but that's only when both paths cost the same (here B was 3.4× pricier than A)", { size: 24, color: COLORS.muted });
  underline(text(90, 835, "measure, don't assume: 2 of my 3 guesses were off", { size: 32 }), COLORS.coral);
});
</script>
</body>
</html>
