<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Patrick+Hand&display=block" rel="stylesheet">
  <style>body { margin: 0; background: #fdfaf3; } svg { display: block; }</style>
</head>
<body>
<svg id="canvas" width="1600" height="900" viewBox="0 0 1600 900"></svg>
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
<script src="sketch.js"></script>
<script>
fontsReady.then(() => {
  title("CSR SpMV & load imbalance", "day 15 · scalar (1 thread/row) vs vector (1 warp/row)");

  // =======================================================================
  // TOP ROW: CSR Format (Compressed Sparse Row)
  // =======================================================================
  const topX = 80, topY = 190, topW = 1440, topH = 150;
  box(topX, topY, topW, topH, { fill: COLORS.yellow, strokeWidth: 2 });
  text(topX + 25, topY + 36, "CSR Representation: Compressing 99%+ Zeroes into 3 Arrays", { size: 26, weight: 700 });

  const csrY = topY + 55;
  const colW = 55, colH = 34, gap = 8;

  // row_ptr: [0, 2, 3, 6, 8] for 4 rows
  text(topX + 25, csrY + 25, "row_ptr", { size: 21, weight: 700, color: COLORS.purple });
  text(topX + 115, csrY + 25, "(start of each row):", { size: 19, color: COLORS.muted });
  const rptr = [0, 2, 3, 6, 8];
  for (let i = 0; i < 5; i++) {
    box(topX + 280 + i * (colW + gap), csrY + 4, colW, colH, { fill: COLORS.purple, label: String(rptr[i]), size: 19 });
  }
  text(topX + 280 + 5 * (colW + gap) + 15, csrY + 25, "→ row 0 has (2-0)=2 nnz, row 2 has (6-3)=3 nnz", { size: 19, color: COLORS.muted });

  // values & col_indices
  text(topX + 25, csrY + 68, "col_idx", { size: 21, weight: 700, color: COLORS.teal });
  text(topX + 115, csrY + 68, "(column in matrix):", { size: 19, color: COLORS.muted });
  const cidx = [0, 3, 2, 0, 1, 3, 1, 2];
  for (let i = 0; i < 8; i++) {
    box(topX + 280 + i * (colW + gap), csrY + 47, colW, colH, { fill: COLORS.teal, label: String(cidx[i]), size: 19 });
  }

  // values
  text(topX + 25, csrY + 110, "values", { size: 21, weight: 700, color: COLORS.coral });
  text(topX + 115, csrY + 110, "(non-zero floats):", { size: 19, color: COLORS.muted });
  const vals = ["4", "1", "7", "3", "8", "2", "6", "5"];
  for (let i = 0; i < 8; i++) {
    box(topX + 280 + i * (colW + gap), csrY + 90, colW, colH, { fill: COLORS.coral, label: vals[i], size: 19 });
  }


  // =======================================================================
  // BOTTOM LEFT: Scalar SpMV (1 Thread Per Row)
  // =======================================================================
  const bY = 360, bW = 700, bH = 340;
  box(topX, bY, bW, bH, { fill: COLORS.coral, strokeWidth: 2 });
  text(topX + bW / 2, bY + 38, "Scalar SpMV (1 Thread Per Row)", { size: 28, weight: 700, anchor: "middle" });
  text(topX + bW / 2, bY + 68, "thread i calculates row i sequentially", { size: 20, color: COLORS.muted, anchor: "middle" });

  text(topX + 30, bY + 110, "1. Uncoalesced Memory Accesses:", { size: 22, weight: 700, color: COLORS.coral });
  text(topX + 30, bY + 140, "• Thread 0 reads row 0, Thread 1 reads row 1 at different offsets", { size: 20 });
  text(topX + 30, bY + 168, "• Memory accesses within a warp are completely non-contiguous!", { size: 20, color: COLORS.muted });

  text(topX + 30, bY + 210, "2. Brutal Load Imbalance & Warp Divergence:", { size: 22, weight: 700, color: COLORS.coral });
  text(topX + 30, bY + 240, "• In a warp of 32 threads, all lanes must run until the LONGEST row finishes", { size: 20 });
  text(topX + 30, bY + 268, "• If Row 0 has 8 non-zeros but Row 1 has 248 non-zeros (power-law):", { size: 20 });
  text(topX + 50, bY + 296, "Thread 0 sits idle for 240 cycles! 90% of the warp is stalled!", { size: 20, color: COLORS.coral, weight: 700 });


  // =======================================================================
  // BOTTOM RIGHT: Vector SpMV (1 Warp Per Row)
  // =======================================================================
  const rightX = 820;
  box(rightX, bY, bW, bH, { fill: COLORS.teal, strokeWidth: 2 });
  text(rightX + bW / 2, bY + 38, "Vector SpMV (1 Warp = 32 Threads Per Row)", { size: 28, weight: 700, anchor: "middle" });
  text(rightX + bW / 2, bY + 68, "entire warp collaborates on row i with stride 32", { size: 20, color: COLORS.teal, weight: 700, anchor: "middle" });

  text(rightX + 30, bY + 110, "1. Perfectly Coalesced Memory Bursts:", { size: 22, weight: 700, color: COLORS.teal });
  text(rightX + 30, bY + 140, "• Lane k reads index (start + k) → 32 lanes read 32 contiguous floats", { size: 20 });
  text(rightX + 30, bY + 168, "• Memory bus serves full 128-byte coalesced transaction!", { size: 20, color: COLORS.teal });

  text(rightX + 30, bY + 210, "2. High-Degree Rows Balanced Across Warp:", { size: 22, weight: 700, color: COLORS.teal });
  text(rightX + 30, bY + 240, "• 248-element hub row: each lane processes only ~8 elements in parallel", { size: 20 });
  text(rightX + 30, bY + 268, "• Warp Reduction: __shfl_down_sync sums 32 lanes in 5 instructions", { size: 20 });
  text(rightX + 50, bY + 296, "Zero shared memory used! Zero __syncthreads() needed!", { size: 20, color: COLORS.purple, weight: 700 });


  // =======================================================================
  // FOOTER BOX: The Takeaway
  // =======================================================================
  const botY = 720, botH = 135;
  box(topX, botY, topW, botH, { fill: COLORS.yellow, strokeWidth: 2 });

  text(topX + 30, botY + 38, "the GPU paradigm: map warps to rows when work is irregular", { size: 26, weight: 700, color: COLORS.coral });
  text(topX + 30, botY + 72, "• In sparse matrices with power-law distributions (graphs, social networks), row lengths vary by orders of magnitude.", { size: 21 });
  text(topX + 30, botY + 100, "• 1-thread-per-row suffers from severe tail-end warp stalls; 1-warp-per-row restores coalescing and load balance.", { size: 21 });

  const takeEl = text(topX + 30, botY + 125, "takeaway: Vector SpMV converts scattered irregular memory reads into coalesced warp bursts with zero divergence",
                      { size: 21, color: COLORS.coral, weight: 700 });
  underline(takeEl, COLORS.coral);
});
</script>
</body>
</html>
