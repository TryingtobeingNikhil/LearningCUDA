<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Patrick+Hand&display=block" rel="stylesheet">
<style>body { margin: 0; background: #fdfaf3; } svg { display: block; }</style>
</head>
<body>
<svg id="canvas" width="1600" height="900" viewBox="0 0 1600 900"></svg>
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
<script src="sketch.js"></script>
<script>
fontsReady.then(() => {
  title("convolution with a halo", "day 08 · the idea behind sheet #22 + #23 (no spoilers)");

  // input tile 6x6 = 4x4 block + 1-wide halo
  const S = 62, x0 = 120, y0 = 250;
  for (let r = 0; r < 6; r++)
    for (let c = 0; c < 6; c++) {
      const halo = r === 0 || c === 0 || r === 5 || c === 5;
      const hl = r >= 1 && r <= 3 && c >= 2 && c <= 4;   // 3x3 window of one output
      box(x0 + c * S, y0 + r * S, S, S, { fill: hl ? COLORS.coral : halo ? COLORS.yellow : COLORS.purple });
    }
  box(x0 + S, y0 + S, 4 * S, 4 * S, { strokeWidth: 4.5 });
  box(x0 + 2 * S, y0 + S, 3 * S, 3 * S, { stroke: "#d94f4f", strokeWidth: 4 });
  text(x0 + 3.5 * S, y0 + 2.5 * S + 9, "•", { size: 40, anchor: "middle" });
  text(x0 + 3 * S, y0 - 20, "coral = the 3×3 window one thread needs (• = its output)", { size: 22, color: COLORS.muted, anchor: "middle" });
  text(x0 + 3 * S, y0 + 6 * S + 40, "shared memory tile: 4×4 + halo = 6×6", { size: 24, anchor: "middle" });
  text(x0 + 3 * S, y0 + 6 * S + 75, "yellow = halo (neighbours' cells)", { size: 22, color: COLORS.muted, anchor: "middle" });

  // filter in constant memory
  const fx = 640, fy = 300;
  for (let r = 0; r < 3; r++)
    for (let c = 0; c < 3; c++) box(fx + c * 58, fy + r * 58, 58, 58, { fill: COLORS.teal, label: `w${r * 3 + c}`, size: 20 });
  text(fx + 87, fy - 20, "3×3 filter", { size: 24, anchor: "middle" });
  text(fx + 87, fy + 3 * 58 + 35, "in __constant__", { size: 24, anchor: "middle" });

  // arrow to one output
  arrow(860, 390, 960, 390);
  box(980, 360, 62, 62, { fill: COLORS.coral, label: "out", size: 20 });
  text(1060, 400, "= Σ  window × filter", { size: 26 });

  const nx = 980;
  text(nx, 500, "1.  the block loads its tile + halo into", { size: 26 });
  text(nx, 536, "     shared memory once, then __syncthreads()", { size: 26 });
  text(nx, 590, "2.  each thread slides the filter over", { size: 26 });
  text(nx, 626, "     its own window, reading only shared memory", { size: 26 });
  text(nx, 680, "3.  filter weights come from constant memory:", { size: 26 });
  text(nx, 716, "     every thread uses w0, then w1 ... together", { size: 26 });

  underline(text(120, 840, "1D is the same thing in one row: day 04's stencil + weights", { size: 30 }), COLORS.coral);
});
</script>
</body>
</html>
