<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Patrick+Hand&display=block" rel="stylesheet">
  <style>body { margin: 0; background: #fdfaf3; } svg { display: block; }</style>
</head>
<body>
<svg id="canvas" width="1600" height="900" viewBox="0 0 1600 900"></svg>
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
<script src="sketch.js"></script>
<script>
fontsReady.then(() => {
  title("sorting network depth", "day 14 · bitonic sort vs odd-even sort on 1M floats (Tesla T4)");

  // =======================================================================
  // TOP SECTION: Side-by-Side Architectural Comparison
  // =======================================================================

  // --- Left: Odd-Even Transposition Sort ---
  const leftX = 80, boxW = 690, topY = 200, boxH = 340;
  box(leftX, topY, boxW, boxH, { fill: COLORS.coral, strokeWidth: 2 });
  text(leftX + boxW / 2, topY + 40, "odd_even_shared (Linear Depth)", { size: 28, weight: 700, anchor: "middle" });
  text(leftX + boxW / 2, topY + 70, "O(N) network depth · 1024 parallel steps", { size: 20, color: COLORS.muted, anchor: "middle" });

  text(leftX + 30, topY + 115, "• 1024 steps = 1024 __syncthreads() barriers!", { size: 21, color: COLORS.coral, weight: 700 });
  text(leftX + 30, topY + 150, "• 524,288 comparisons per 1024-element block", { size: 21 });
  text(leftX + 30, topY + 185, "• each barrier stalls 16 warps waiting for the slowest lane", { size: 21 });
  text(leftX + 30, topY + 220, "• barrier latency & sync overhead dominates execution", { size: 21, color: COLORS.muted });
  text(leftX + 30, topY + 270, "→ 4.422 ms  (baseline, slowest)", { size: 25, color: COLORS.coral, weight: 700 });
  text(leftX + 30, topY + 305, "linear network depth accumulates massive barrier stalls", { size: 19, color: COLORS.muted });


  // --- Right: Bitonic Sort ---
  const rightX = 830;
  box(rightX, topY, boxW, boxH, { fill: COLORS.teal, strokeWidth: 2 });
  text(rightX + boxW / 2, topY + 40, "bitonic_shared (Logarithmic Depth)", { size: 28, weight: 700, anchor: "middle" });
  text(rightX + boxW / 2, topY + 70, "O(log^2 N) network depth · 55 parallel steps", { size: 20, color: COLORS.teal, weight: 700, anchor: "middle" });

  text(rightX + 30, topY + 115, "• 55 steps = only 55 __syncthreads() barriers!", { size: 21, color: COLORS.teal, weight: 700 });
  text(rightX + 30, topY + 150, "• 28,160 comparisons per block (18.6× fewer operations!)", { size: 21 });
  text(rightX + 30, topY + 185, "• butterfly merge network keeps active threads balanced", { size: 21 });
  text(rightX + 30, topY + 220, "• 100% on-chip shared memory: zero global memory traffic", { size: 21, color: COLORS.purple, weight: 700 });
  text(rightX + 30, topY + 270, "→ 0.277 ms  (15.98× faster)", { size: 25, color: COLORS.teal, weight: 700 });
  text(rightX + 30, topY + 305, "speedup directly mirrors the 18.6× drop in network depth!", { size: 19, color: COLORS.muted });


  // =======================================================================
  // BOTTOM SECTION: Measured Benchmark Table (Tesla T4)
  // =======================================================================
  const tableY = 575;
  line(leftX, tableY, 1480, tableY, { stroke: COLORS.muted, strokeWidth: 1 });

  text(leftX, tableY + 30, "measured on Tesla T4 (N = 1M floats / 4 MB, 1024 blocks of 1024 elements, 7 interleaved rounds, median):",
       { size: 21, color: COLORS.muted });

  const cols = [leftX, leftX + 320, leftX + 570, leftX + 870, leftX + 1150];
  const rowH = 40;

  // table headers
  text(cols[0], tableY + 72, "kernel", { size: 21, color: COLORS.muted });
  text(cols[1], tableY + 72, "steps / block", { size: 21, color: COLORS.muted });
  text(cols[2], tableY + 72, "median time", { size: 21, color: COLORS.muted });
  text(cols[3], tableY + 72, "spread", { size: 21, color: COLORS.muted });
  text(cols[4], tableY + 72, "speedup", { size: 21, color: COLORS.muted });

  const rows = [
    ["odd_even_shared", "1024 steps (1024 barriers)", "4.422 ms", "4.382 – 4.467 ms", "baseline (O(N) depth)"],
    ["bitonic_shared",  "55 steps (55 barriers)",     "0.277 ms", "0.274 – 0.283 ms", "15.98× faster (O(log^2 N))"],
  ];

  for (let r = 0; r < rows.length; r++) {
    const y = tableY + 114 + r * rowH;
    const isBase = r === 0;
    const color  = isBase ? COLORS.coral : COLORS.teal;

    text(cols[0], y, rows[r][0], { size: 22, color: INK });
    text(cols[1], y, rows[r][1], { size: 21, color: COLORS.muted });
    text(cols[2], y, rows[r][2], { size: 22, color: color, weight: isBase ? 400 : 700 });
    text(cols[3], y, rows[r][3], { size: 20, color: COLORS.muted });
    text(cols[4], y, rows[r][4], { size: 22, color: color, weight: isBase ? 400 : 700 });
  }

  const takeawayEl = text(leftX, tableY + 225, "takeaway: cutting network depth from 1024 to 55 barriers delivered a clean 16× speedup on real hardware",
                          { size: 23, color: COLORS.coral, weight: 700 });
  underline(takeawayEl, COLORS.coral);
});
</script>
</body>
</html>
