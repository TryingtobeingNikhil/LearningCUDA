<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Patrick+Hand&display=block" rel="stylesheet">
<style>body { margin: 0; background: #fdfaf3; } svg { display: block; }</style>
</head>
<body>
<svg id="canvas" width="1600" height="900" viewBox="0 0 1600 900"></svg>
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
<script src="sketch.js"></script>
<script>
fontsReady.then(() => {
  title("2D threads → matrix", "day 02 · mapping (row, col) to memory");

  // 6 x 8 matrix, 2 x 2 grid of 4 x 3 blocks
  const x0 = 170, y0 = 270, W = 80, H = 64, COLS = 8, ROWS = 6;
  const HR = 4, HC = 6;  // highlighted cell

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const bx = Math.floor(c / 4), by = Math.floor(r / 3);
      const hl = r === HR && c === HC;
      const fill = hl ? COLORS.coral : (bx === by ? COLORS.teal : undefined);
      box(x0 + c * W, y0 + r * H, W, H, { fill });
      text(x0 + c * W + W / 2, y0 + r * H + H / 2 + 8, String(r * COLS + c),
           { size: hl ? 28 : 22, color: hl ? INK : COLORS.muted, anchor: "middle" });
    }
  }
  // thick block borders + labels
  for (let by = 0; by < 2; by++) {
    for (let bx = 0; bx < 2; bx++) {
      box(x0 + bx * 4 * W, y0 + by * 3 * H, 4 * W, 3 * H, { strokeWidth: 4.5 });
      const ly = by === 0 ? y0 - 16 : y0 + ROWS * H + 38;
      text(x0 + bx * 4 * W + 2 * W, ly, `block (${bx},${by})`, { size: 26, anchor: "middle" });
    }
  }
  text(x0, 770, "dim3 block(4, 3);   dim3 grid(2, 2);   → 4 blocks × 12 threads = 48", { size: 28 });

  // formulas
  const rx = 930;
  text(rx, 290, "2D → 1D", { font: "'Caveat', cursive", size: 52, weight: 700 });
  text(rx, 350, "col = blockIdx.x * blockDim.x + threadIdx.x", { size: 27 });
  text(rx, 392, "row = blockIdx.y * blockDim.y + threadIdx.y", { size: 27 });
  text(rx, 434, "idx = row * width + col", { size: 27 });

  text(rx, 515, "block (1,1), thread (2,1):", { size: 28, color: COLORS.muted });
  text(rx, 560, "row = 1 × 3 + 1 = 4", { size: 30 });
  text(rx, 602, "col = 1 × 4 + 2 = 6", { size: 30 });
  underline(text(rx, 660, "idx = 4 × 8 + 6 = 38", { size: 36 }), COLORS.coral);
});
</script>
</body>
</html>
