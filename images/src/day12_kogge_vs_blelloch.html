<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Patrick+Hand&display=block" rel="stylesheet">
  <style>body { margin: 0; background: #fdfaf3; } svg { display: block; }</style>
</head>
<body>
<svg id="canvas" width="1600" height="900" viewBox="0 0 1600 900"></svg>
<script src="https://cdn.jsdelivr.net/npm/roughjs@4.6.6/bundled/rough.js"></script>
<script src="sketch.js"></script>
<script>
fontsReady.then(() => {
  title("parallel scan", "day 12 · kogge-stone vs blelloch in a block");

  // =======================================================================
  // LEFT COLUMN: Kogge-Stone (Step-Efficient)
  // =======================================================================
  const leftX = 80, colW = 690, topY = 190, boxH = 480;
  box(leftX, topY, colW, boxH, { fill: COLORS.teal, strokeWidth: 2 });

  text(leftX + colW / 2, topY + 38, "Kogge-Stone (Step-Efficient)", { size: 28, weight: 700, anchor: "middle" });
  text(leftX + colW / 2, topY + 68, "log2(N) steps · uniform execution · inclusive scan", { size: 20, color: COLORS.muted, anchor: "middle" });

  // 8 elements demo: [3, 1, 7, 0, 4, 1, 6, 3]
  const elemW = 68, elemH = 40, elemGap = 12;
  const kStartX = leftX + 35;
  const rowYs = [topY + 115, topY + 185, topY + 255, topY + 325];

  const rowLabels = ["input", "stride = 1", "stride = 2", "stride = 4"];
  for (let r = 0; r < 4; r++) {
    text(kStartX - 10, rowYs[r] + 26, rowLabels[r], { size: 18, color: COLORS.muted, anchor: "end" });
  }

  // Row 0: Input [3, 1, 7, 0, 4, 1, 6, 3]
  const inVals = [3, 1, 7, 0, 4, 1, 6, 3];
  for (let i = 0; i < 8; i++) {
    box(kStartX + i * (elemW + elemGap), rowYs[0], elemW, elemH,
        { fill: COLORS.purple, label: String(inVals[i]), size: 22 });
  }

  // Row 1: stride = 1 [3, 4, 8, 7, 4, 5, 7, 9]
  const s1Vals = [3, 4, 8, 7, 4, 5, 7, 9];
  for (let i = 0; i < 8; i++) {
    box(kStartX + i * (elemW + elemGap), rowYs[1], elemW, elemH,
        { fill: i >= 1 ? COLORS.teal : COLORS.purple, label: String(s1Vals[i]), size: 22 });
    if (i >= 1) {
      arrow(kStartX + (i - 1) * (elemW + elemGap) + elemW / 2, rowYs[0] + elemH,
            kStartX + i * (elemW + elemGap) + elemW / 2, rowYs[1] - 2, { head: 10, stroke: COLORS.teal });
    }
  }

  // Row 2: stride = 2 [3, 4, 11, 11, 12, 12, 11, 14]
  const s2Vals = [3, 4, 11, 11, 12, 12, 11, 14];
  for (let i = 0; i < 8; i++) {
    box(kStartX + i * (elemW + elemGap), rowYs[2], elemW, elemH,
        { fill: i >= 2 ? COLORS.teal : COLORS.purple, label: String(s2Vals[i]), size: 22 });
  }

  // Row 3: stride = 4 [3, 4, 11, 11, 15, 16, 22, 25] -> final inclusive scan!
  const s3Vals = [3, 4, 11, 11, 15, 16, 22, 25];
  for (let i = 0; i < 8; i++) {
    box(kStartX + i * (elemW + elemGap), rowYs[3], elemW, elemH,
        { fill: COLORS.coral, label: String(s3Vals[i]), size: 22 });
  }

  // Notes on Kogge-Stone
  text(leftX + 30, topY + 400, "• 1024 elements = 10 steps (strides 1, 2, 4 ... 512)", { size: 21 });
  text(leftX + 30, topY + 430, "• double buffering: only 10 __syncthreads() total", { size: 21, color: COLORS.teal });
  text(leftX + 30, topY + 460, "• Work: O(N log N) additions — more math, but uniform", { size: 21 });


  // =======================================================================
  // RIGHT COLUMN: Blelloch (Work-Efficient)
  // =======================================================================
  const rightX = 830;
  box(rightX, topY, colW, boxH, { fill: COLORS.purple, strokeWidth: 2 });

  text(rightX + colW / 2, topY + 38, "Blelloch (Work-Efficient)", { size: 28, weight: 700, anchor: "middle" });
  text(rightX + colW / 2, topY + 68, "2·log2(N) steps · tree up-sweep & down-sweep · exclusive", { size: 20, color: COLORS.muted, anchor: "middle" });

  // Phase 1: Up-sweep (Reduction Tree)
  const bY1 = topY + 115;
  text(rightX + 35, bY1 + 18, "Phase 1: Up-sweep (Reduce Tree)", { size: 22, weight: 700 });
  text(rightX + 35, bY1 + 45, "stride doubles (1 → 2 → 4). root collects total sum = 25", { size: 20, color: COLORS.muted });

  // Draw miniature tree nodes for up-sweep
  const treeY = bY1 + 80;
  for (let i = 0; i < 8; i++) {
    circle(rightX + 60 + i * 78, treeY, 32, { fill: COLORS.purple, label: String(inVals[i]), size: 18 });
  }
  for (let i = 0; i < 4; i++) {
    circle(rightX + 99 + i * 156, treeY + 48, 34, { fill: COLORS.teal, label: String(s1Vals[2 * i + 1]), size: 18 });
  }
  for (let i = 0; i < 2; i++) {
    circle(rightX + 177 + i * 312, treeY + 95, 36, { fill: COLORS.teal, label: i === 0 ? "11" : "14", size: 18 });
  }
  circle(rightX + 333, treeY + 142, 40, { fill: COLORS.coral, label: "25", size: 20 });

  // Phase 2: Root reset & Down-sweep
  const bY2 = topY + 315;
  text(rightX + 35, bY2 + 25, "Phase 2: Set root = 0 & Down-sweep", { size: 22, weight: 700 });
  text(rightX + 35, bY2 + 52, "pass parent down to left child, set right = left + parent", { size: 20, color: COLORS.muted });

  // Output row: Exclusive scan [0, 3, 4, 11, 11, 15, 16, 22]
  const bOutVals = [0, 3, 4, 11, 11, 15, 16, 22];
  for (let i = 0; i < 8; i++) {
    box(rightX + 35 + i * (elemW + elemGap), bY2 + 70, elemW, elemH,
        { fill: COLORS.coral, label: String(bOutVals[i]), size: 22 });
  }

  // Notes on Blelloch
  text(rightX + 30, topY + 440, "• 1024 elements = 20 steps (10 up-sweep + 10 down-sweep)", { size: 21 });
  text(rightX + 30, topY + 465, "• Work: O(N) operations (~2N adds) — optimal on paper!", { size: 21, color: COLORS.teal });


  // =======================================================================
  // BOTTOM BOX: The GPU Trade-Off
  // =======================================================================
  const botY = 695, botH = 160;
  box(leftX, botY, 1440, botH, { fill: COLORS.yellow, strokeWidth: 2 });

  text(leftX + 30, botY + 38, "the GPU reality: work-efficiency vs execution efficiency", { size: 26, weight: 700, color: COLORS.coral });
  text(leftX + 30, botY + 75, "• Blelloch does fewer arithmetic operations O(N), BUT requires ~20 barriers (__syncthreads()) and heavy warp divergence.", { size: 21 });
  text(leftX + 30, botY + 105, "• Kogge-Stone does O(N log N) additions, BUT runs in only 10 steps, 10 barriers (double-buffered), and zero warp divergence.", { size: 21 });

  const takeEl = text(leftX + 30, botY + 138, "takeaway: arithmetic is dirt cheap on GPUs; barriers and branch serialization are expensive",
                      { size: 22, color: COLORS.coral, weight: 700 });
  underline(takeEl, COLORS.coral);
});
</script>
</body>
</html>
